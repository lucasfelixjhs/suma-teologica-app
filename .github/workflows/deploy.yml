name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar dependencias web
        run: npx expo install react-dom react-native-web @expo/metro-runtime -- --legacy-peer-deps

      - name: Configurar ruta base
        run: |
          node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          c.expo.web = { ...(c.expo.web || {}), output: 'single' };
          c.expo.experiments = { ...(c.expo.experiments || {}), baseUrl: '/' + process.env.GITHUB_REPOSITORY.split('/')[1] };
          fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          "

      - name: Exportar versión web
        run: npx expo export --platform web

      - name: Preparar archivos
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
